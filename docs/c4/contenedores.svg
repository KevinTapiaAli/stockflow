<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 490" role="img" aria-labelledby="title desc">
<title id="title">StockFlow: C4 Nivel 2</title><desc id="desc">React se ejecuta en el navegador, Nginx es la única entrada HTTP y redirige la API a NestJS, que accede a PostgreSQL por una red bridge interna.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#526779"/></marker></defs>
<rect width="950" height="490" rx="10" fill="#f7fafb"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="475" y="28" font-size="18" fill="#12304a">C4 · Nivel 2 · Contenedores</text>
<rect x="280" y="58" width="648" height="393" rx="9" fill="none" stroke="#7794aa" stroke-dasharray="6 4"/>
<text x="600" y="82" font-size="13" fill="#455c6f">Docker Compose · Red bridge stockflow</text>
<rect x="24" y="105" width="208" height="60" rx="7" fill="#173b5e"/><text x="128" y="130" fill="white" font-size="15">Administrador</text><text x="128" y="151" fill="white" font-size="11">[Persona]</text>
<rect x="20" y="208" width="216" height="166" rx="8" fill="none" stroke="#7794aa" stroke-dasharray="5 3"/><text x="128" y="230" font-size="12" fill="#455c6f">Navegador</text>
<rect x="32" y="246" width="192" height="110" rx="8" fill="#2771aa"/><text x="128" y="273" fill="white" font-size="17">Frontend React</text><text x="128" y="297" fill="white" font-size="11">[Contenedor: SPA]</text><text x="128" y="322" fill="white" font-size="12">TypeScript + Tailwind</text>
<path d="M128 165v70" stroke="#526779" stroke-width="2" marker-end="url(#a)"/>
<rect x="310" y="246" width="180" height="110" rx="8" fill="#2771aa"/><text x="400" y="274" fill="white" font-size="18">API Gateway</text><text x="400" y="298" fill="white" font-size="12">[Contenedor: Nginx]</text><text x="400" y="323" fill="white" font-size="11">Frontend + proxy + CORS</text><text x="400" y="341" fill="white" font-size="11">Logging + rate limiting</text>
<path d="M224 295h77" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><text x="263" y="272" font-size="10" fill="#455c6f">HTTP</text><text x="263" y="286" font-size="10" fill="#455c6f">:8080</text><text x="400" y="388" font-size="11" fill="#455c6f">Único puerto publicado</text><text x="400" y="407" font-size="11" fill="#455c6f">127.0.0.1:8080 → :80</text>
<rect x="552" y="246" width="164" height="110" rx="8" fill="#2771aa"/><text x="634" y="274" fill="white" font-size="17">Microservicio</text><text x="634" y="298" fill="white" font-size="12">[Contenedor: NestJS]</text><text x="634" y="323" fill="white" font-size="11">Reglas + Prisma + DTO</text>
<path d="M490 295h53" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><text x="520" y="268" font-size="10" fill="#455c6f">/api/*</text><text x="520" y="283" font-size="10" fill="#455c6f">:3000</text>
<rect x="772" y="246" width="134" height="110" rx="8" fill="#2771aa"/><text x="839" y="274" fill="white" font-size="16">PostgreSQL</text><text x="839" y="299" fill="white" font-size="11">[Contenedor: BD]</text><text x="839" y="323" fill="white" font-size="11">Volumen persistente</text>
<path d="M716 295h47" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><text x="744" y="269" font-size="10" fill="#455c6f">TCP</text><text x="744" y="284" font-size="10" fill="#455c6f">:5432</text>
<text x="600" y="134" font-size="12" fill="#455c6f">El frontend se descarga de Nginx como HTML, JS y CSS.</text><text x="600" y="157" font-size="12" fill="#455c6f">Las llamadas Fetch usan /api/ del mismo origen.</text><text x="475" y="477" font-size="11" fill="#526779">NestJS y PostgreSQL no publican puertos al host. HTTP interno; instalación académica local.</text>
</g></svg>
