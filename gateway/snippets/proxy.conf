if ($request_method = OPTIONS) { return 204; }
# Sin URI final: conserva /api/, métodos, cuerpo y query string.
# Resolver Docker + variable: vuelve a resolver backend tras recrear el contenedor.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://backend:3000;
proxy_pass $backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Connection "";
proxy_hide_header X-Request-ID;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
# No repetir escrituras en otro intento de proxy.
proxy_next_upstream off;
proxy_intercept_errors on;
error_page 502 503 504 = @unavailable;
error_page 429 = @limited;
