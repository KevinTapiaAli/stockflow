user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format stockflow escape=json '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time,"upstream":"$upstream_addr","upstreamStatus":"$upstream_status"}';
    access_log /dev/stdout stockflow;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 1m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    include /etc/nginx/conf.d/*.conf;
}
